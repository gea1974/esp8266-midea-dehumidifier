; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266_1M128

[core8266]
platform = espressif8266@2.6.3
platform_packages = framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#2.7.4
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-14120
lib_deps = 
	bblanchon/ArduinoJson @ ^6.10.1
	tzapu/WiFiManager @ ^0.15.0
	knolleary/PubSubClient @ ^2.8

[env:esp8266_1M128]
extends  = core8266
board = esp01_1m
board_build.flash_mode    = dout
board_build.ldscript      = eagle.flash.1m128.ld
upload_port = /dev/cu.usbserial-0001
 
[env:esp8266_2M256]
extends  = core8266
board = esp_wroom_02
board_build.ldscript      = eagle.flash.2m256.ld
upload_port = /dev/cu.usbserial-0001
 
[env:esp8266_4M1M]
extends  = core8266
board = d1_mini
board_build.ldscript      = eagle.flash.4m1m.ld
upload_port = /dev/cu.usbserial-0001